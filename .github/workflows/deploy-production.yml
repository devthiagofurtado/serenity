name: Deploy Serenity - Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serenity-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Production
    runs-on: ubuntu-24.04

    environment: production

    timeout-minutes: 15

    env:
      SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
      SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
      SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}

      REMOTE_ROOT: /home/u104003371/domains/serenitybodyworks.site
      REMOTE_PUBLIC: /home/u104003371/domains/serenitybodyworks.site/public_html
      REMOTE_BACKEND: /home/u104003371/domains/serenitybodyworks.site/production-backend

    steps:
      - name: Validate production branch
        if: github.ref != 'refs/heads/main'
        run: |
            echo "Production deployments are allowed only from main."
            exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate project structure
        run: |
          set -euo pipefail

          test -f public/index.html
          test -d backend

          echo "Project structure validated."

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host serenity-hostinger
              HostName ${SSH_HOST}
              User ${SSH_USER}
              Port ${SSH_PORT}
              IdentityFile ~/.ssh/id_ed25519
              IdentitiesOnly yes
              BatchMode yes
              StrictHostKeyChecking yes
          EOF

          chmod 600 ~/.ssh/config

      - name: Validate SSH and remote directories
        run: |
          set -euo pipefail

          ssh serenity-hostinger \
            "test -d '$REMOTE_ROOT' && \
             test -d '$REMOTE_PUBLIC' && \
             test -d '$REMOTE_BACKEND' && \
             test -d '$REMOTE_PUBLIC/staging' && \
             command -v rsync"

          echo "Production directories validated."

      - name: Deploy private backend
        run: |
          set -euo pipefail

          rsync -az \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='storage/' \
            --exclude='logs/' \
            --exclude='vendor/' \
            --exclude='*.log' \
            backend/ \
            "serenity-hostinger:${REMOTE_BACKEND}/"

      - name: Deploy public frontend
        run: |
          set -euo pipefail

          rsync -az \
            --exclude='staging/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.git/' \
            --exclude='*.log' \
            public/ \
            "serenity-hostinger:${REMOTE_PUBLIC}/"

      - name: Deployment completed
        run: |
          echo "Production deployment completed."
          echo "Branch: main"
          echo "URL: https://serenitybodyworks.site"